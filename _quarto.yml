project:
  type: website

# Profil `complet` par défaut (en local) ; `wip` (_quarto-wip.yml) masque les cartes
# de l'accueil et les jours de la barre de navigation ; `parution`
# (_quarto-parution.yml, écrit par scripts/parution.py selon la date), utilisé par
# GitHub Actions, ne rend que les jours arrivés. Les liens de la barre propres à
# chaque profil sont dans leur fichier : Quarto ajoute leurs listes à celle-ci.
profile:
  default: complet

lang: fr

website:
  title: "30daymapchallenge"
  navbar:
    title: '30daymapchallenge<span class="navbar-sous-titre">2026 · Lino Galiana</span>'
    left:
      - href: index.qmd
        text: Accueil
    right:
      - icon: github
        href: https://github.com/linogaliana/30daymapchallenge2026
        aria-label: Code du site
  page-footer:
    left: "Lino Galiana · #30DayMapChallenge 2026"
    right: "Données de la statistique publique · [Code source](https://github.com/linogaliana/30daymapchallenge2026)"

execute:
  freeze: auto

format:
  html:
    theme:
      light: [cosmo, theme.scss, theme-clair.scss]
      dark: [darkly, theme.scss, theme-sombre.scss]
    respect-user-color-scheme: true
    css: styles.css
    # Le même thème de code, sombre, en clair et en sombre (voir theme.scss).
    highlight-style:
      light: arrow-dark
      dark: arrow-dark
    filters:
      - en-cours.lua
      - approche.lua
      - copies.lua
      - charte.lua
      - entete.lua
      - parution.lua
    toc: true
    author: Lino Galiana



