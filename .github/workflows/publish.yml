name: Publication du site

# Rend le site avec Quarto (installé par uv, paquet quarto-cli) et le publie sur
# GitHub Pages. _freeze/ n'est pas versionné : les calculs sont gardés d'une
# exécution à l'autre dans le cache d'Actions, et une page n'est recalculée que
# si son .qmd a changé (freeze: auto). Sans cache, tout est retéléchargé.
#
# Le jour N paraît le N novembre : le profil parution, écrit par
# scripts/parution.py selon la date du rendu, ne rend que les jours arrivés. Le
# site est donc reconstruit à chaque push et tous les jours à minuit (heure de Paris).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 23 h 05 UTC, soit 0 h 05 à Paris en novembre (UTC+1), à partir du 31 octobre.
  schedule:
    - cron: "5 23 * 10,11 *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendu:
    runs-on: ubuntu-latest
    # La date du rendu est celle de Paris : pour scripts/parution.py et pour
    # en-cours.lua (avertissement des pages dont le jour n'est pas arrivé).
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Dépendances
        run: uv sync --locked

      # Une entrée par exécution (les rendus quotidiens partagent le commit du
      # dernier push, mais ajoutent le calcul du nouveau jour) ; à défaut, la plus
      # récente de la branche, puis celle de main.
      - name: Cache des calculs (_freeze)
        uses: actions/cache@v4
        with:
          path: _freeze
          key: freeze-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            freeze-${{ github.ref_name }}-
            freeze-main-

      # Profil parution (_quarto-parution.yml, généré) : seuls les jours arrivés
      # sont rendus, dans le calendrier de l'accueil et dans la barre de navigation.
      - name: Jours parus
        run: uv run python scripts/parution.py

      - name: Rendu
        run: uv run quarto render --profile parution

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  publication:
    if: github.event_name != 'pull_request'
    needs: rendu
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
